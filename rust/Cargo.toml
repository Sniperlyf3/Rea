[workspace]
resolver = "2"
members = [
    "crates/quicmedia-core",
    "crates/quicmedia-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sniperlyf3/Rea"
authors = ["Rea contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "macros"] }
# QUIC
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
rustls-pki-types = "1"
# Misc
bytes = "1.7"
thiserror = "2"
tracing = "0.1"
crossbeam-channel = "0.5"
# Codec (optional, feature-gated). 0.2 is the latest stable; 0.3 is prerelease-only.
audiopus = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
