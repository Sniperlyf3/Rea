[package]
name = "quicmedia-core"
description = "QUIC-based real-time audio + data transport core (capture → Opus → QUIC datagrams → jitter buffer → render), native data path."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tokio = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
rustls-pki-types = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
crossbeam-channel = { workspace = true }
sha2 = "0.10"

# Optional Opus codec (bundled libopus, built via cmake/cc).
audiopus = { workspace = true, optional = true }

[build-dependencies]
# Compiles the vendored miniaudio single-header + C shim when `miniaudio-backend` is on.
cc = "1"

[features]
# Headless-safe defaults: builds with no system audio deps.
# Real deployments enable `opus-codec` and `miniaudio-backend`.
default = []
opus-codec = ["dep:audiopus"]
# Native real-device audio via vendored miniaudio (header-only C, built by build.rs).
# No Rust dependency: build.rs keys off the CARGO_FEATURE_MINIAUDIO_BACKEND env var.
miniaudio-backend = []

[dev-dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "macros", "test-util"] }
