# Regenerate include/quicmedia.h with:
#   cbindgen --config cbindgen.toml --crate quicmedia-ffi --output include/quicmedia.h
# The committed header is authoritative; keep this config in sync with it.
language = "C"
pragma_once = false
include_guard = "QUICMEDIA_H"
autogen_warning = "/* Generated by cbindgen. Edits may be overwritten. */"
style = "type"
cpp_compat = true

[export]
prefix = "Qm"

[parse]
parse_deps = false
